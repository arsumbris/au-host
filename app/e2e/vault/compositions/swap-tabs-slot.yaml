# SWAP-TABS-SLOT fixture — a window → tabs whose one tab is a ruled POSITION (`^: tabslot`) holding
# editor#ed. The position id differs from the occupant id, so a swap keyed by the wrong one never opens.
type: composition::au-host-sdk
windows:
  - "[[^^w]]"
projections:
  - type: window::au-host-sdk
    primary: true
    content: "[[^^tabs]]"
    ^: w
  - ^: tabs
    type: tabs::tabs
    tabs:
      - ^: tabslot
        type: container-slot::au-host-sdk
        label: "Pinned"
        child: "[[^^ed]]"
  - ^: ed
    type: editor-pane::editor
    file: sample.md
