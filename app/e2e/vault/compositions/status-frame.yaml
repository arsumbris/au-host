type: composition::au-host-sdk
windows: ["[[^^w]]"]
projections:
  - ^: w
    type: window::au-host-sdk
    primary: true
    content: "[[^^dock]]"
  - ^: dock
    type: dock::dock
    center: "[[^^editor]]"
    bottom: ["[[^^bar]]"]
  - ^: editor
    type: editor-pane::editor
    file: sample.md
  - ^: bar
    type: bar::bar
    end:
      - type: engine-status-bar-item::engine-status
