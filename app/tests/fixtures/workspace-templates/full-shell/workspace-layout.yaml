type: composition::au-host-sdk
windows:
  - "[[^^window]]"
projections:
  - ^: window
    type: window::au-host-sdk
    primary: true
    content: "[[^^layout]]"
  - ^: layout
    type: sandwich::sandwich
    left:
      type: sandwich-slot::sandwich
      child: "[[^^files]]"
      label: Files
      size: 240
    center:
      type: sandwich-slot::sandwich
      child: "[[^^work]]"
      hideHeader: true
    right:
      type: sandwich-slot::sandwich
      child: "[[^^backlinks]]"
      label: Backlinks
      size: 260
  - ^: files
    type: file-tree::file-tree
  - ^: documents
    type: tabs::tabs
    tabs:
      - "[[^^document]]"
    newTabPosition: after-source
  - ^: document
    type: editor-pane::editor
    file: Welcome.md
  - ^: work
    type: column::column
    showItemHeaders: false
    items:
      - type: column-slot::column
        child: "[[^^documents]]"
        size: 3
      - type: column-slot::column
        child: "[[^^terminal]]"
        size: 1
  - ^: terminal
    type: terminal::terminal
  - ^: backlinks
    type: backlinks::backlinks
intent-routing:
  wires:
    - intent: "[[open-intent::intent]]"
      mode: strict
      source: "[[^^files]]"
      targets:
        - "[[^^documents]]"
viewer-defaults:
  defaults:
    - opens: md
      viewer: "[[editor-pane::editor]]"
keymaps:
  - "[[default.keymap]]"
