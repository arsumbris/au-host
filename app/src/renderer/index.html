<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>au-host</title>
    <style>
      /* Painted immediately, before the module bundle and tokens load, so the window shows an "app is
         loading" state on the first frame instead of a dead black void for the second or two the
         renderer takes to mount. Self-contained (no --au-* tokens — they are not loaded yet). The
         splash is removed from main.tsx once React has painted its first frame. */
      html,
      body,
      #root {
        /* A real height chain: the launcher mounts inside a `<Dissolve>` whose layers are
           `block-size:100%` and carry a `filter` (which makes them the containing block for the
           launcher's `position:fixed` stage). Without height here that chain collapses to 0 and the
           launcher paints nothing (black). */
        height: 100%;
        margin: 0;
        background: #0b0b0c;
        /* The app frame is exactly the window: full width + height, and it NEVER scrolls. Any scroll
           belongs to an explicit inner container (a pane body, the config panel), never the whole app.
           So a stray over-wide/over-tall descendant clips here rather than scrolling the window. */
        overflow: hidden;
      }
      #boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0b0b0c;
        color: #8a8a8f;
        font-family: system-ui, -apple-system, sans-serif;
      }
      #boot-splash .boot-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
      }
      #boot-splash .boot-spinner {
        width: 22px;
        height: 22px;
        border: 2px solid #2a2a2e;
        border-top-color: #6b6b72;
        border-radius: 50%;
        animation: boot-spin 0.7s linear infinite;
      }
      #boot-splash .boot-name {
        font-size: 12px;
        letter-spacing: 0.04em;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-splash .boot-spinner {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="boot-splash">
      <div class="boot-inner">
        <div class="boot-spinner"></div>
        <div class="boot-name">au-host</div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
