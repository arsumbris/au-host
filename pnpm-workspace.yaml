packages:
  - app
  - packages/*
  - projections/*
# pnpm's install-script DENY list: only these packages may run build/postinstall scripts.
# This is the active supply-chain control (most attacks execute via a postinstall payload),
# so keep it MINIMAL and AUDITED — add a package only when it genuinely needs a native build.
allowBuilds:
  esbuild: true
  electron: true
  node-pty: true
  sharp: false   # not a dependency here; denied so it stays off the allowlist unless actually needed

# Transitive-dependency version overrides (security fixes for deps we don't declare directly).
overrides:
  tar: "^7.5.19"   # GHSA-23hp-3jrh-7fpw: node-tar DoS <=7.5.18; pulled transitively via @electron/rebuild > node-gyp
