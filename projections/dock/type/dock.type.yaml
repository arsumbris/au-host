# dock IS a `frame-container`: the fill `center` it inherits (typically a bento) plus BARS on its four
# edges. "Chrome" is a dock at the root. Corner ownership: top/bottom span the full width, left/right
# sit between them.
# Each edge is a LIST of bars in outward order, typed to the BAR kind, so a third-party bar fits by
# extending `bar-projection`. An edge holds bare bar references, never a `container-slot`: a slot's
# `child` is `mountable*` and cannot be narrowed to bars, so a ruled edge slot could admit a non-bar.
# dock owns its bars' placement: it adds, moves and removes them through its own menu.
extends: frame-container::au-host-sdk
fields:
  #: Bars along the top edge, outermost first.
  top?: bar-projection::au-host-sdk*[]
  #: Bars along the bottom edge, outermost first.
  bottom?: bar-projection::au-host-sdk*[]
  #: Bars along the left edge, outermost first.
  left?: bar-projection::au-host-sdk*[]
  #: Bars along the right edge, outermost first.
  right?: bar-projection::au-host-sdk*[]
meta:
  # `entry` is relative to the owning package root; the built ESM is ./dist/.
  - type: projection-runtime-meta::au-host-sdk
    entry: ./dist/index.js
    contractVersion: 8
