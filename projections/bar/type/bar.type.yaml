# bar IS a `container-projection`: it lays out child projection instances linearly with
# alignment regions. A first-party container peer to bento, swappable. It is also an AGGREGATOR:
# when `role` is set it discovers projections OF THAT KIND and offers not-yet-added ones as
# available-to-add (a candidate, never a merge — accepting writes config). Children nest via
# `projection&[]` (inline or referenced); each child instance's TYPE names its surface, FIELDS are its config.
#
# NOT a layout container, DELIBERATELY. A bar has NO placement seam: you do not drag a pane into or out
# of a bar, it AGGREGATES a role and holds aggregated/configured chrome. So its regions hold bar's OWN
# `bar-item` type (the widget in `view`), NOT `mountable*`/`projection&`. The slot walker recognizes a
# layout child by its occupant being a `mountable` (content) or a `container-node` (structure); a
# `bar-item` is neither, so `deriveContainerSchemas` skips a bar BY TYPE and the pool never flattens its
# items — they are the bar record's own inline config, not re-parentable pool members. The widget itself
# stays a projection (bar mounts it via `host.children.mount`), just wrapped so it is not mistaken for a
# layout child.
extends: container-projection::au-host-sdk
fields:
  # main-axis orientation; horizontal (a top/bottom bar) by default, vertical for a side bar.
  orientation?: [horizontal, vertical]
  # the chrome ROLE this bar aggregates — a def-ref to a projection KIND type-def (e.g.
  # `role: [[status-projection]]`). When set, the bar discovers projections of that kind
  # (the role IS the kind; `readSubtypes(kind)` via the host's contributions query) and offers
  # not-yet-added ones as available-to-add. Unset = a pure explicit-config bar (no aggregation).
  # Accepting appends the instance to a region (default `end`).
  role?: type<projection::au-host-sdk>*
  # the three alignment regions, each a list of `bar-item`s (bar's OWN type, holding a widget in
  # `view`). All optional; a status bar typically fills only `end`, a menu bar only `start`. These are
  # `bar-item[]`, NOT `projection&`/`mountable*`, so the slot walker skips a bar by type: a bar has no
  # placement seam, and its items are not re-parentable layout children. See `bar-item.type.yaml`.
  start?: bar-item[]
  center?: bar-item[]
  end?: bar-item[]
meta:
  # `entry` is relative to the owning package root; the built ESM is./dist/.
  - type: projection-runtime-meta::au-host-sdk
    entry: ./dist/index.js
    contractVersion: 7
  # The intents this projection FIRES (fires-intent-meta, the mirror of handles-intent-meta).
  # host.intent.fire is gated on this declaration (rung 3, warn+ratchet).

  - type: fires-intent-meta::au-host-sdk
    fires:
      - "[[reposition::dock]]"
