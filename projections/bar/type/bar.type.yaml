# bar IS a `bar-projection`: a strip on a frame edge laying out bar items in three alignment regions.
# It is NOT a container-projection. Its regions are its own config: each holds INLINE bar-item records
# (a concrete `bar-item-projection` subtype plus its fields), which bar mounts itself via
# `host.children.mount`. The slot walker and the pool never visit a non-container, so an item is never
# a re-parentable layout child; an item REFERENCE here would sit outside every child position and be
# reaped, so items are inline-only.
# bar offers every discovered `bar-item-projection` subtype not yet placed as an item to add.
# Its orientation follows the dock edge it sits on (left/right vertical, top/bottom horizontal); off an
# edge it renders horizontal.
extends: bar-projection::au-host-sdk
fields:
  #: Items aligned to the start of the main axis.
  start?: bar-item-projection::au-host-sdk[]
  #: Items centered on the main axis.
  center?: bar-item-projection::au-host-sdk[]
  #: Items aligned to the end of the main axis.
  end?: bar-item-projection::au-host-sdk[]
meta:
  # `entry` is relative to the owning package root; the built ESM is ./dist/.
  - type: projection-runtime-meta::au-host-sdk
    entry: ./dist/index.js
    contractVersion: 8
