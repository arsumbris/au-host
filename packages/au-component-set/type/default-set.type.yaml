# The first-party DEFAULT set as a `component-set` subtype (owned by au-component-set).
#
# Its TYPE NAME `default-set` is the well-known FLOOR the host resolution recognizes
# (`DEFAULT_SET_TYPE` in component-registry.ts). It carries a `component-set-runtime-meta` locator:
# the host discovers it via `readSubtypes('component-set')`, loads `./dist/index.js`, and calls the
# `register` export, which defines the Lit elements into the host-chosen registry.
#
# `provides` is a def-ref list into the catalog (cross-repo, hence the `au-component-catalog` dep in
# repo.yaml) — it drives per-tag coverage + the resolution cascade.
#: The first-party default component set (the resolution FLOOR). A subtype carrying a
#: runtime-meta locator; the host loads it and calls register() to define its Lit elements.
extends: component-set::component-contract
fields: {}
meta:
  - type: component-set-runtime-meta::component-contract
    entry: ./dist/index.js
    contractVersion: 1
    # Declarations-only sheet for the set's `--au-<component>-*` tokens. The host eager-loads it so
    # the theming pane discovers every component's knobs via the CSSOM. Read from the
    # package root (source, not dist) — it is CSS the host fetches + validates, not bundled code.
    customTokenEntry:
      - ./component-set.tokens.css
    provides:
      - "[[au-icon::au-component-catalog]]"
      - "[[au-icon-button::au-component-catalog]]"
      - "[[au-grip-glyph::au-component-catalog]]"
      - "[[au-close-button::au-component-catalog]]"
