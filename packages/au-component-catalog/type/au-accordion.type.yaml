# Owned by component-contract. The INTERFACE for `<au-accordion>` — the collapsible disclosure GROUP.
#
# The type NAME is the custom-element tag. A stack of <au-accordion-item> children (slotted) whose open
# state this group coordinates: `single` (opening one closes its siblings) or `multiple` (independent). It
# propagates `variant` / `density` onto each item and keyboard-roves Arrow/Home/End across their triggers.
# Depth is a hairline + surface-lift only — never a leading accent bar.
#: The interface for <au-accordion>: a disclosure group over slotted <au-accordion-item>s — single/multiple
#: open, flush/card/inline, keyboard roving. Emits `au-change {open}` (the open item values).
extends: ui-component::component-contract
fields:
  #: Open policy. `multiple` (default, items open independently) or `single` (opening one closes its siblings).
  #: (Named `mode`, not `type` — `type` is the reserved codegen discriminant.)
  mode?: [single, multiple]
  #: Container treatment. `flush` (default, hairline-divided rows in a frame) / `card` / `inline` (bordered blocks).
  variant?: [flush, card, inline]
  #: Row rhythm. `compact` (32) / `default` (40) / `relaxed` (48) header min-height.
  density?: [compact, default, relaxed]
  #: In `single` mode, allow closing the one open item by clicking it again.
  collapsible?: Boolean
meta:
  - type: ui-component-meta::component-contract
    events: [au-change]
    states: [mode, variant, density]
    slots: [default]
    preview: '<au-accordion variant="card"></au-accordion>'
