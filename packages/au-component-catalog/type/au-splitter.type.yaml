#: Hairline knob is a rounded notch shown on hover/focus/drag; the hit target remains available at rest.
# Owned by component-contract. The INTERFACE for `<au-splitter>` — the resize-sash look.
#
# The type NAME is the custom-element tag. Fields are the props; the meta block carries states + the
# gallery sample. Look-only: the container owns the resize PHYSICS (pointer capture, width math).
#: The interface for <au-splitter>: the sash LOOK between two panes. A transparent grab strip with a
#: centered hairline + optional knob that lift to the accent on hover / drag. The container owns physics.
extends: ui-component::component-contract
fields:
  #: Vertical (between side-by-side panes, col-resize) or horizontal (stacked, row-resize). Default vertical.
  orientation?: [vertical, horizontal]
  #: The in-flight resize — lifts the hairline + knob to the accent. The container sets this while dragging.
  dragging?: Boolean
  #: Non-resizable seam — faint hairline, no knob, no resize cursor.
  disabled?: Boolean
  #: Show the small centered knob (a grab affordance). Default true.
  knob?: Boolean
  #: Draw the centered hairline. Default true; pass false when both neighbours already draw their own edge.
  line?: Boolean
  #: `hairline` (the mark) or `grab` (a touch-sized slab that overflows the seam). Default hairline.
  knobSize?: [hairline, grab]
meta:
  - type: ui-component-meta::component-contract
    states: [dragging, disabled]
    preview: '<div style="display:flex; height:80px"><div style="flex:1; background:var(--au-elev-3-fill); border-radius:var(--au-radius-panel)"></div><au-splitter knob-size="grab"></au-splitter><div style="flex:1; background:var(--au-elev-3-fill); border-radius:var(--au-radius-panel)"></div></div>'
