# Owned by component-contract. The INTERFACE for `<au-section-header>` — a sidebar / panel group label.
#
# The type NAME is the custom-element tag. Fields are the props (data-in); the meta block carries
# events-out, content regions, states, parts. Set-INDEPENDENT: a consumer types against THIS.
#
# The quiet section label that titles a group: mono, small, muted ink, an optional right-aligned `count`
# and an optional `actions` slot. `collapsible` composes a disclosure chevron (a real keyboard target).
# The LABEL is the default slot (NOT a `title` prop — that shadows HTMLElement.title). `sans` steps the
# label up to the full sans face for a named panel section; `caps` opts into the mono uppercase eyebrow;
# `locked` reads a step quieter and suppresses collapse. Emits `au-toggle` (composed + bubbling).
#: The interface for <au-section-header>: a group-label eyebrow. Default-slot label + `count` +
#: `actions` slot; `collapsible` / `open` / `sans` / `caps` / `locked`. Emits au-toggle.
extends: ui-component::component-contract
fields:
  #: A right-aligned trailing count (a machine-ish number, pinned to the quiet mono face).
  count?: String
  #: Make the header a disclosure control — composes a leading chevron, emits au-toggle on activate.
  collapsible?: Boolean
  #: Disclosure state (rotates the chevron). Default false (closed); a non-collapsible header ignores it.
  open?: Boolean
  #: Step the label up to the full sans reading face for a NAMED panel section.
  sans?: Boolean
  #: Opt into the mono UPPERCASE eyebrow — reserve for a genuinely machine-ish (status / enum) label.
  caps?: Boolean
  #: Put the disclosure chevron at the TRAILING (right) edge instead of leading.
  chevronEnd?: Boolean
  #: Structure-locked group — the label reads a step quieter and collapse is suppressed.
  locked?: Boolean
meta:
  - type: ui-component-meta::component-contract
    events: [au-toggle]
    slots: [actions]
    states: [collapsible, open, sans, caps, locked]
    parts: [header, chevron, label, count, actions]
    preview: '<au-section-header caps>SESSION</au-section-header> <au-section-header sans count="12" collapsible open>Properties</au-section-header> <au-section-header collapsible>Backbone</au-section-header>'
