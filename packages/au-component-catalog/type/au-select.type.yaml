# Owned by component-contract. The INTERFACE for `<au-select>` — the form value-picker.
#
# The type NAME is the custom-element tag. Fields are the props (data-in); the meta block carries
# events-out + states. A field TRIGGER (matching au-input's box so a select and an input line up) plus a
# floating LISTBOX of `options`. DATA-DRIVEN: `options` is a au-select-option[] the consumer owns.
#
# THE OVERLAY SEAM: the listbox draws into a layer CLAIMED from `host.overlay` (the `dropdown` band), never
# a body portal. The component owns the
# menu UI + placement off the trigger rect + light-dismiss + keyboard; the host owns the layer + stacking.
#
# FORM-ASSOCIATED: the chosen `value` crosses the shadow boundary into a native `<form>` + reset. Emits
# `au-change` (detail `{ value }`, composed + bubbling) on pick.
#: The interface for <au-select>: a value-picker — a field trigger + a floating listbox over `options`
#: (au-select-option[]) drawn through host.overlay. Form-associated. Emits `au-change {value}`. Keyboard
#: listbox nav (Arrow/Home/End/Enter/Escape).
extends: ui-component::component-contract
fields:
  #: The option model. The consumer owns it; the control renders + navigates.
  options?: au-select-option[]
  #: The chosen option's value. Empty → the placeholder shows. Form-associated.
  value?: String
  #: Shown in the field when nothing is selected.
  placeholder?: String
  #: Non-interactive + de-emphasized. Reflected as the `disabled` state.
  disabled?: Boolean
  #: Trigger height step. `md` (default), `sm` (dense rows), `lg` (roomy) — parity with au-input.
  size?: [sm, md, lg]
  #: Accessible name for the trigger + listbox.
  label?: String
  #: Optional icon-only trigger; label supplies its accessible name.
  triggerIcon?: String
meta:
  - type: ui-component-meta::component-contract
    events: [au-change]
    states: [disabled, open]
    parts: [trigger, icon, value, chevron]
    preview: '<au-select placeholder="Choose a theme…"></au-select> <au-select value="dark"></au-select>'
