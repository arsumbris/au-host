# Owned by component-contract. The INTERFACE for `<au-field>` — the form-row composition primitive.
#
# The type NAME is the custom-element tag. Fields are the props (data-in); the meta block carries
# slots + parts. Set-INDEPENDENT: a consumer types against THIS.
#
# The CONTROL is the default slot. A rich label rides the `label` slot; a simple string rides the
# `label` prop (slot fallback). Clicking the label focuses the slotted control (the cross-shadow
# label↔control tie; a slotted control is light DOM, so `<label for>` cannot cross the boundary).
# Optional default-set association: a single directly slotted FieldParticipant receives simple label,
# description and aria-invalid/required contributions. Authored control names win. Multiple controls,
# wrappers and rich labels need explicit semantics; required does not enable native form validation.
#: The interface for <au-field>: the form-row composition primitive. Wraps a control (default slot)
#: with a label, optional hint, and an `error` danger-ink message. stack = label above, inline = grid.
extends: ui-component::component-contract
fields:
  #: Simple label text (slot fallback). For rich label content, slot into `label` instead.
  label?: String
  #: Helper text below the control (shown unless `error` replaces it).
  hint?: String
  #: When set, replaces the hint with a danger-ink message. (The slotted control carries its own
  #: error state; au-field does not reach across the shadow boundary to set it.)
  error?: String
  #: Draw a subtle required marker after the label.
  required?: Boolean
  #: stack = label above the control; inline = a two-column grid (label · control). Default stack.
  layout?: [stack, inline]
meta:
  - type: ui-component-meta::component-contract
    slots: [default, label]
    parts: [label, control, hint, error]
    preview: '<au-field label="Filter tokens"><au-input placeholder="e.g. accent…"></au-input></au-field> <au-field layout="inline" label="Inline"><au-input value="v"></au-input></au-field> <au-field label="Name" required hint="shown as a helper"><au-input></au-input></au-field> <au-field label="Broken" error="must not be empty"><au-input error></au-input></au-field>'
