  - p
  - q
  - r
  - s
  - t
  - u
  - v
  - w
  - x
  - y
  - z
  # the digit row — event.code Digit0..Digit9, letter-led
  - digit0
  - digit1
  - digit2
  - digit3
  - digit4
  - digit5
  - digit6
  - digit7
  - digit8
