# Owned by au-host-sdk. The BAR kind: a strip on a frame edge (a dock edge) that lays out bar items
# along its main axis. `bar` (the bar package) is the first-party concrete subtype; a third-party bar
# fits a dock edge by extending this kind. A bar is NOT a container-projection: it holds its items as
# its own config and mounts them itself. Its orientation is a consequence of the edge it sits on.

# Abstract: a projection kind. Only concrete bar subtypes are instantiated.
abstract: true
extends: projection
fields: {}
